name: Fetch logos

# Runs the resolver on a GitHub runner, which has open outbound network access.
# Trigger it from the Actions tab: Run workflow -> pick your options.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Figma-path prefix to limit the run (e.g. banks/indo). Blank = everything.'
        required: false
        default: ''
      dry_run:
        description: 'Resolve candidates only, download nothing'
        type: boolean
        default: false
      min_edge:
        description: 'Minimum longest edge in px for raster sources'
        required: false
        default: '128'
      delay:
        description: 'Seconds between requests'
        required: false
        default: '1.0'
      commit:
        description: 'Commit the downloaded assets back to this branch'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      # Python block-buffers stdout when it isn't a TTY (i.e. under Actions),
      # so without this the per-row progress lines the script prints can sit
      # invisible for a long stretch before a buffer flush - looks stuck even
      # when it isn't. This makes every step's Python output stream live.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch logos
        run: |
          python3 scripts/fetch_logos.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            --min-edge '${{ inputs.min_edge }}' \
            --delay '${{ inputs.delay }}'

      - name: Rebuild workbook
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/build_sheet.py

      # Always published, so you can inspect the results even without committing.
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: logo-assets
          if-no-files-found: warn
          path: |
            assets/**
            data/fetch_report.csv
            data/master_list.tsv
            data/master_list.csv
            out/*.xlsx

      - name: Commit assets
        if: ${{ inputs.commit && !inputs.dry_run }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A assets data out
          git diff --staged --quiet && echo 'nothing to commit' && exit 0
          git commit -m 'Fetch logo assets via workflow run ${{ github.run_number }}'

          # A fetch run takes tens of minutes; anything else pushed to this branch in
          # that window makes a plain `git push` fail as a non-fast-forward. Rebase onto
          # whatever landed and retry rather than losing an hour-plus of fetched assets
          # to a race - this hit twice before this loop existed.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) - fetching and rebasing onto latest"
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              echo "rebase hit a real conflict - not something a retry can fix, needs a human"
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "push still failing after 5 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo '### Fetch report' >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/fetch_report.csv ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '| outcome | rows |' >> "$GITHUB_STEP_SUMMARY"
            echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
            tail -n +2 data/fetch_report.csv | cut -d, -f2 | sort | uniq -c \
              | awk '{printf "| %s | %s |\n", $2, $1}' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
